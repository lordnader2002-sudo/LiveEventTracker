# Fetches live events near all properties and commits the feed.
name: Fetch events

on:
  schedule:
    # Every morning at 6am ET. GitHub cron is UTC, which has no DST awareness:
    # 10:00 UTC = 6am EDT (summer) / 5am EST (winter).
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      radius_miles:
        description: "Search radius around each property (miles)"
        required: false
        default: "5"
      lookahead_days:
        description: "How many days ahead to search"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: fetch-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch events from all configured sources
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
          EVENTBRITE_API_TOKEN: ${{ secrets.EVENTBRITE_API_TOKEN }}
          STUBHUB_CLIENT_ID: ${{ secrets.STUBHUB_CLIENT_ID }}
          STUBHUB_CLIENT_SECRET: ${{ secrets.STUBHUB_CLIENT_SECRET }}
          RADIUS_MILES: ${{ github.event.inputs.radius_miles || '5' }}
          LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '30' }}
        run: python scripts/fetch_events.py

      # When the Supabase secrets exist, the feed moves to the private bucket
      # (authenticated read only) and the public copy becomes a lock stub, so
      # the site requires the shared password. Without the secrets everything
      # keeps working in the original public mode.
      - name: Publish feed to Supabase private bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase secrets not set — feed stays public in docs/data/events.json."
            exit 0
          fi
          SUPABASE_URL="${SUPABASE_URL%/}"; SUPABASE_URL="${SUPABASE_URL%/rest/v1}"; SUPABASE_URL="${SUPABASE_URL%/}"
          curl -fsS -X POST "${SUPABASE_URL}/storage/v1/object/dashboard/live_events_data.json" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "x-upsert: true" -H "Content-Type: application/json" \
            --data-binary @docs/data/events.json
          echo '{"locked": true}' > docs/data/events.json
          echo "Feed uploaded to private bucket; public copy replaced with lock stub."

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json docs/data/properties.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update event feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
